[project]
name = "lab0"
version = "0.1.0"
description = "Lab0: data preprocessing logic, CLI and tests (MLOps fundamentals of CI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "pylint>=3.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
